<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>LightMC Applications</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c14;--panel:#11131e;--card:#171a28;--card2:#1d2133;--border:#262a3d;--text:#e7e8f0;--muted:#8d92ab;
  --acc:#ffd700;--acc2:#ffb300;--acc-t:#1a1400;--discord:#5865f2;
  --pending:#ffd700;--under_review:#ffa500;--accepted:#57f287;--denied:#ed4245;--cancelled:#8d92ab;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2f45;border-radius:10px;border:2px solid var(--bg)}

/* lock */
#lock{min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 500px at 50% -10%,rgba(255,215,0,.13),transparent 60%),var(--bg)}
.lockbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:32px 28px;text-align:center;box-shadow:0 30px 80px #0008}
.lockbox img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 3px var(--acc),0 0 40px rgba(255,215,0,.35)}
.lockbox h1{font-size:22px;margin:16px 0 4px}
.lockbox p{color:var(--muted);margin:0 0 22px}
.field{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;outline:none}
.field:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--card2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-t);border:0}
.btn.primary:hover{filter:brightness(1.06)}
.btn.discord{background:var(--discord);border:0;color:#fff}
.btn.ok{background:color-mix(in srgb,var(--accepted) 18%,var(--card));border-color:color-mix(in srgb,var(--accepted) 50%,transparent);color:var(--accepted)}
.btn.no{background:color-mix(in srgb,var(--denied) 18%,var(--card));border-color:color-mix(in srgb,var(--denied) 50%,transparent);color:var(--denied)}
.btn.rev{background:color-mix(in srgb,var(--under_review) 16%,var(--card));border-color:color-mix(in srgb,var(--under_review) 50%,transparent);color:var(--under_review)}
.lockbox .btn.primary{width:100%;padding:12px;margin-top:12px}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);margin-top:14px;font-size:13px}
.err{color:var(--denied);min-height:20px;margin-top:10px;font-size:13px}

/* app */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
header>img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px var(--acc)}
header .title{font-weight:800;font-size:16px}
header .sub{color:var(--muted);font-size:12px}
header .sp{flex:1}
.me{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border:1px solid var(--border);border-radius:99px;background:var(--card)}
.me img{width:28px;height:28px;border-radius:50%}
.me span{font-weight:600;font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.me button{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:14px 20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:.15s}
.stat:hover{border-color:#3a3f58}
.stat.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{color:var(--muted);font-size:12px;font-weight:600}
.toolbar{display:flex;gap:10px;padding:0 20px 12px;flex-wrap:wrap}
.toolbar .field{width:auto;padding:9px 12px}
.toolbar .search{flex:1;min-width:200px}
main{flex:1;display:grid;grid-template-columns:380px 1fr;min-height:0;border-top:1px solid var(--border)}
#list{overflow:auto;border-right:1px solid var(--border);background:var(--panel)}
.item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.item:hover{background:var(--card)}
.item.sel{background:var(--card2)}
.item.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.av{width:40px;height:40px;border-radius:50%;background:var(--card2);flex:none;object-fit:cover;display:grid;place-items:center;font-weight:800;color:var(--acc)}
.item .meta{min-width:0;flex:1}
.item .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .right{text-align:right;flex:none}
.item .d{color:var(--muted);font-size:11px;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.section-h{padding:10px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--bg);border-bottom:1px solid var(--border)}

#detail{overflow:auto;padding:24px 28px 60px}
.dhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dhead .av{width:72px;height:72px;font-size:26px;box-shadow:0 0 0 3px var(--acc)}
.dhead h2{margin:0;font-size:22px}
.dhead .sub{color:var(--muted)}
.dhead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.decide{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 0;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r);background:linear-gradient(90deg,rgba(255,215,0,.06),transparent)}
.decide .lbl{font-weight:700;margin-right:auto}
.decide .hint{color:var(--muted);font-size:12px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:20px 0}
.cell{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:0}
.cell b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cell span{word-break:break-word}
.code{font-family:ui-monospace,Consolas,monospace;background:#0007;padding:1px 6px;border-radius:6px;color:var(--acc)}
.note{border-left:3px solid;border-radius:8px;background:var(--card);padding:10px 14px;margin:0 0 18px}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.qa{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.qa .q{font-weight:700;color:var(--acc);display:flex;gap:10px}
.qa .q i{font-style:normal;color:var(--muted);min-width:22px}
.qa .orig{color:var(--muted);font-size:12px;margin:2px 0 0 32px}
.qa .a{margin-top:8px;white-space:pre-wrap;word-break:break-word;background:#0006;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.qa .a.emptyans{color:var(--muted);font-style:italic}
mark{background:rgba(255,215,0,.35);color:inherit;border-radius:3px}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 14px 22px;color:var(--muted)}
.timeline li::before{content:"";position:absolute;left:4px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--dot,var(--acc))}
.timeline li::after{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--border)}
.timeline li:last-child::after{display:none}
.timeline b{color:var(--text)}
.placeholder{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}
.placeholder img{width:90px;opacity:.6;border-radius:50%;margin-bottom:10px}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.back{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px #0008;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.on{opacity:1}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:0;width:min(480px,calc(100vw - 32px));box-shadow:0 30px 80px #000a}
dialog::backdrop{background:#000a;backdrop-filter:blur(2px)}
.dlg{padding:22px}
.dlg h4{margin:0 0 6px;font-size:18px}
.dlg p{color:var(--muted);margin:0 0 14px}
.dlg textarea{width:100%;min-height:110px;resize:vertical;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none}
.dlg textarea:focus{border-color:var(--acc)}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.dlg .status{margin-top:14px;font-size:13px;min-height:20px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  header{padding:10px 16px;flex-wrap:wrap}
  .stats{padding:12px 16px;gap:8px}.stat b{font-size:18px}
  .toolbar{padding:0 16px 12px}
  main{grid-template-columns:1fr}
  #list{border-right:0}
  main.showdetail #list{display:none}
  main:not(.showdetail) #detail{display:none}
  #detail{padding:16px 16px 60px}
  .back{display:inline-flex;margin-bottom:14px}
  .dhead .actions{margin-left:0;width:100%}
}
</style>
</head>
<body>

<section id="lock">
  <form class="lockbox" id="lockform" autocomplete="off">
    <img src="logo.png" alt="">
    <h1>LightMC Applications</h1>
    <p>Staff-only area</p>
    <input class="field" id="pw" type="password" placeholder="Dashboard password" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="unlockbtn">Unlock</button>
    <label class="remember"><input type="checkbox" id="remember"> Remember me on this device</label>
    <div class="err" id="lockerr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <img src="logo.png" alt="">
    <div>
      <div class="title" id="gname">LightMC</div>
      <div class="sub" id="updated">—</div>
    </div>
    <div class="sp"></div>
    <div id="auth"></div>
    <button class="btn" id="refresh" title="Refresh">⟳ Refresh</button>
    <button class="btn" id="export" title="Export CSV">⤓ CSV</button>
    <button class="btn" id="logout" title="Lock">Lock</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input class="field search" id="q" type="search" placeholder="Search name, ID, code or answer text…">
    <select class="field" id="frole"><option value="">All roles</option></select>
    <select class="field" id="flang"><option value="">All languages</option><option value="en">🇬🇧 English</option><option value="it">🇮🇹 Italian</option></select>
    <select class="field" id="fsort">
      <option value="new">Newest first</option><option value="old">Oldest first</option>
      <option value="upd">Recently updated</option><option value="name">Name A→Z</option>
    </select>
  </div>

  <main id="main">
    <div id="list"></div>
    <div id="detail"></div>
  </main>
</section>

<dialog id="login"><form class="dlg" method="dialog">
  <h4>🔐 Staff sign-in</h4>
  <p>The bot will send a 6-digit code to your Discord DMs. Only staff members can sign in.</p>
  <div id="lstep1"><input class="field" id="luser" placeholder="Your Discord username or user ID" autocomplete="username"></div>
  <div id="lstep2" class="hidden"><input class="field" id="lcode" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="letter-spacing:.4em;font-size:20px;text-align:center"></div>
  <div class="status" id="lstatus"></div>
  <div class="row">
    <button class="btn" value="cancel" formnovalidate>Cancel</button>
    <button class="btn primary" id="lgo">Send me a code</button>
  </div>
</form></dialog>

<dialog id="dlg"><form class="dlg" method="dialog" id="dlgform">
  <h4 id="dlgtitle">Confirm</h4>
  <p id="dlgtext"></p>
  <textarea id="dlgreason" maxlength="1000" placeholder="Reason (optional) — it will be sent to the applicant"></textarea>
  <div class="status" id="dlgstatus"></div>
  <div class="row">
    <button class="btn" value="cancel" id="dlgcancel" formnovalidate>Cancel</button>
    <button class="btn primary" value="ok" id="dlgok">Confirm</button>
  </div>
</form></dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const DATA_URL = 'data.enc.json';
  const PW_KEY = 'lmc_dash_pw', DC_KEY = 'lmc_dash_staff';
  const ITER = 250000;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64e = (buf) => { let s = ''; new Uint8Array(buf).forEach((b) => s += String.fromCharCode(b)); return btoa(s); };
  const fmt = (ms, opt = {dateStyle:'medium', timeStyle:'short'}) => ms ? new Date(ms).toLocaleString('en-GB', opt) : '—';
  const ago = (ms) => {
    if (!ms) return '—';
    const s = Math.round((Date.now() - ms) / 1000), a = Math.abs(s);
    const [v, u] = a < 60 ? [a, 's'] : a < 3600 ? [Math.round(a/60), 'min'] : a < 86400 ? [Math.round(a/3600), 'h'] : [Math.round(a/86400), 'd'];
    return s >= 0 ? `${v}${u === 'min' ? ' min' : u} ago` : `in ${v}${u === 'min' ? ' min' : u}`;
  };
  const dur = (sec) => { if (!sec) return '—'; const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const kv = { get(k){ try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
               set(k, v, persist){ try { (persist ? localStorage : sessionStorage).setItem(k, v); } catch {} },
               del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
               ss(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch { return null; } } };

  let password = null, DB = null, selected = null, discord = null;
  const filter = { status: '', q: '', role: '', lang: '', sort: 'new' };

  // ---------- crypto (same format as the bot) ----------
  async function deriveKey(pw, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function decrypt(env, pw) {
    const key = await deriveKey(pw, b64d(env.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(env.iv) }, key, b64d(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function encrypt(obj, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pw, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { v: 1, alg: 'AES-256-GCM', kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64e(salt), iv: b64e(iv), data: b64e(ct) };
  }

  // ---------- GitHub API (after unlock, gives fresh data + action queue) ----------
  async function gh(path, opts = {}) {
    const r = DB.remote;
    const res = await fetch(`https://api.github.com/repos/${r.repo}/${path}`, {
      ...opts, cache: 'no-store',
      headers: { Authorization: `Bearer ${r.token}`, Accept: opts.accept || 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    });
    if (res.status === 404 && opts.allow404) return null;
    if (!res.ok) throw new Error(`GitHub ${res.status}`);
    return opts.accept ? res.text() : res.status === 204 ? null : res.json();
  }

  async function load(pw) {
    let env;
    if (DB?.remote?.token) {
      try { env = JSON.parse(await gh(`contents/${DB.remote.dataPath}?ref=${DB.remote.branch}`, { accept: 'application/vnd.github.raw+json' })); } catch {}
    }
    if (!env) {
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (res.status === 404) throw new Error("The bot hasn't published any data yet.");
      if (!res.ok) throw new Error(`Couldn't load the data (HTTP ${res.status}).`);
      env = await res.json();
    }
    try { return await decrypt(env, pw); } catch { const e = new Error('Wrong password.'); e.badpw = true; throw e; }
  }

  // ---------- staff sign-in: the bot DMs a 6-digit code ----------
  function readDiscord() {
    try { const d = JSON.parse(kv.get(DC_KEY) || 'null'); return d && d.session && d.exp > Date.now() + 60_000 ? d : null; } catch { return null; }
  }
  function signIn() { openLogin(); }
  function signOut() {
    const s = discord?.session;
    kv.del(DC_KEY); discord = null; render();
    if (s) queue({ action: 'logout', session: s }, () => {}).catch(() => {});
  }
  function renderAuth() {
    const el = $('#auth');
    if (!DB?.remote?.token) { el.innerHTML = ''; return; }
    if (!discord) {
      el.innerHTML = `<button class="btn discord" id="signin">🔐 Staff sign-in</button>`;
      $('#signin').onclick = signIn;
      return;
    }
    const u = discord.user || {};
    el.innerHTML = `<div class="me" title="Signed in as @${esc(u.username)}"><img src="${esc(u.avatar || 'logo.png')}" alt=""><span>${esc(u.displayName || u.username || 'Staff')}</span><button id="signout" title="Sign out">✕</button></div>`;
    $('#signout').onclick = signOut;
  }
  function openLogin() {
    const dlg = $('#login'), go = $('#lgo'), st = $('#lstatus');
    let challenge = null;
    const step = (n) => { $('#lstep1').classList.toggle('hidden', n !== 1); $('#lstep2').classList.toggle('hidden', n !== 2); go.textContent = n === 1 ? 'Send me a code' : 'Sign in'; };
    step(1); st.innerHTML = ''; $('#luser').value = ''; $('#lcode').value = ''; go.disabled = false;
    const busy = (t) => st.innerHTML = `<span class="spin"></span>${esc(t)}`;
    const err = (t) => st.innerHTML = `<span style="color:var(--denied)">⚠️ ${esc(t)}</span>`;
    go.onclick = async (ev) => {
      ev.preventDefault(); go.disabled = true;
      try {
        if (!challenge) {
          const user = $('#luser').value.trim();
          if (!user) { err('Type your Discord username or ID.'); return; }
          const r = await queue({ action: 'login', user }, busy);
          if (!r.ok) { err(`${r.title}: ${r.text}`); return; }
          challenge = r.challenge; step(2);
          st.innerHTML = `✅ Code sent by DM to <b>${esc(r.user.displayName || r.user.username)}</b>. Check Discord.`;
          setTimeout(() => $('#lcode').focus(), 50);
        } else {
          const r = await queue({ action: 'verify', challenge, code: $('#lcode').value }, busy);
          if (!r.ok) { err(`${r.title}: ${r.text}`); if (r.restart) { challenge = null; step(1); } return; }
          discord = { session: r.session, exp: r.exp, user: r.user };
          kv.set(DC_KEY, JSON.stringify(discord), !!localStorage.getItem(PW_KEY));
          dlg.close(); render(); toast(`Signed in as ${r.user.displayName || r.user.username}`);
        }
      } catch (e) { err(e.message); }
      finally { go.disabled = false; }
    };
    dlg.showModal();
    setTimeout(() => $('#luser').focus(), 50);
  }

  // ---------- lock ----------
  $('#lockform').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const pw = $('#pw').value, btn = $('#unlockbtn');
    btn.disabled = true; btn.textContent = 'Decrypting…'; $('#lockerr').textContent = '';
    try {
      DB = await load(pw); password = pw;
      kv.del(PW_KEY); kv.set(PW_KEY, pw, $('#remember').checked);
      openApp();
    } catch (e) { $('#lockerr').textContent = e.message; }
    finally { btn.disabled = false; btn.textContent = 'Unlock'; }
  });

  $('#logout').onclick = () => { kv.del(PW_KEY); kv.del(DC_KEY); location.hash = ''; location.reload(); };

  async function refresh(silent) {
    try {
      DB = await load(password);
      render();
      if (!silent) toast('Data refreshed');
    } catch (e) {
      if (e.badpw) { kv.del(PW_KEY); location.reload(); }
      else if (!silent) toast(e.message);
    }
  }
  $('#refresh').onclick = () => refresh(false);

  async function openApp() {
    $('#lock').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#frole').innerHTML = '<option value="">All roles</option>' +
      Object.entries(DB.roles || {}).map(([k, r]) => `<option value="${esc(k)}">${esc(r.emoji)} ${esc(r.label)}</option>`).join('');
    const m = /^#app-(\d+)$/.exec(location.hash);
    if (m) selected = Number(m[1]);
    discord = readDiscord();
    render();
    if (DB.remote?.token) refresh(true); // swap the (possibly cached) Pages copy for the live one
    setInterval(() => document.visibilityState === 'visible' && !$('#dlg').open && refresh(true), 30_000);
  }

  // ---------- render ----------
  const stLabel = (s) => DB.status?.[s]?.en || s;
  const stEmoji = (s) => DB.status?.[s]?.emoji || '📝';
  const badge = (s) => `<span class="badge" style="color:var(--${s});border-color:color-mix(in srgb,var(--${s}) 45%,transparent);background:color-mix(in srgb,var(--${s}) 13%,transparent)">${stEmoji(s)} ${esc(stLabel(s))}</span>`;
  const role = (k) => DB.roles?.[k] || { label: k, emoji: '📄' };
  const initial = (a) => esc((a.displayName || a.username || '?')[0].toUpperCase());
  const avatar = (a, cls = 'av') => a.avatar
    ? `<img class="${cls}" src="${esc(a.avatar)}" alt="" loading="lazy" data-fallback="${initial(a)}">`
    : `<div class="${cls}">${initial(a)}</div>`;
  const fixAvatars = (root) => root.querySelectorAll('img[data-fallback]').forEach((img) => img.onerror = () => {
    const d = document.createElement('div'); d.className = img.className; d.textContent = img.dataset.fallback; img.replaceWith(d);
  });
  const qText = (x) => x.questionEn || x.question;

  function filtered() {
    const q = filter.q.trim().toLowerCase();
    const list = DB.applications.filter((a) =>
      (!filter.status || a.status === filter.status) &&
      (!filter.role || a.roleKey === filter.role) &&
      (!filter.lang || (a.language || 'en') === filter.lang) &&
      (!q || [a.username, a.displayName, a.userId, a.code, `#${a.id}`, a.reviewNotes, ...a.answers.map((x) => x.answer)]
        .some((v) => String(v || '').toLowerCase().includes(q))));
    const by = { new: (a, b) => b.createdAt - a.createdAt, old: (a, b) => a.createdAt - b.createdAt,
                 upd: (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0), name: (a, b) => (a.displayName || a.username).localeCompare(b.displayName || b.username) };
    return list.sort(by[filter.sort]);
  }

  function renderStats() {
    const apps = DB.applications;
    const n = (s) => apps.filter((a) => a.status === s).length;
    const cards = [
      ['', 'Total', apps.length], ['pending', '📝 Pending', n('pending')], ['under_review', '👀 Under review', n('under_review')],
      ['accepted', '✅ Accepted', n('accepted')], ['denied', '❌ Denied', n('denied')], ['__live', '✍️ Filling in now', (DB.sessions || []).length],
    ];
    $('#stats').innerHTML = cards.map(([k, l, v]) =>
      `<div class="stat ${filter.status === k ? 'on' : ''}" data-k="${k}"><b ${k && k !== '__live' ? `style="color:var(--${k})"` : ''}>${v}</b><span>${l}</span></div>`).join('');
    $('#stats').querySelectorAll('.stat').forEach((el) => el.onclick = () => {
      const k = el.dataset.k;
      filter.status = filter.status === k ? '' : k;
      render();
    });
  }

  function renderList() {
    const el = $('#list');
    if (filter.status === '__live') {
      const s = DB.sessions || [];
      el.innerHTML = `<div class="section-h">Filling in an application right now</div>` + (s.length ? s.map((x) => {
        const r = role(x.roleKey), pct = x.total ? Math.round(x.index / x.total * 100) : 0;
        const stage = x.stage === 'language' ? 'choosing a language' : x.stage === 'confirm' ? 'reviewing their answers' : `question ${x.index + 1}/${x.total}`;
        return `<div class="item"><div class="av">${esc((x.displayName || '?')[0].toUpperCase())}</div><div class="meta">
          <div class="n">${esc(x.displayName || x.userId)}</div>
          <div class="r">${esc(r.emoji)} ${esc(r.label)} • ${stage}</div>
          <div class="bar"><div style="width:${pct}%"></div></div></div>
          <div class="right"><div class="d">active ${ago(x.lastActivity)}</div></div></div>`;
      }).join('') : '<div class="empty">Nobody is filling in an application right now.</div>');
      return;
    }
    const list = filtered();
    if (!list.length) { el.innerHTML = '<div class="empty">No applications found.</div>'; return; }
    el.innerHTML = list.map((a) => {
      const r = role(a.roleKey);
      return `<div class="item ${a.id === selected ? 'sel' : ''}" data-id="${a.id}">
        ${avatar(a)}
        <div class="meta"><div class="n">${esc(a.displayName || a.username)}</div>
        <div class="r">${esc(r.emoji)} ${esc(r.label)} • #${a.id}${a.language === 'it' ? ' • 🇮🇹' : ''}</div></div>
        <div class="right">${badge(a.status)}<div class="d" title="${esc(fmt(a.createdAt))}">${ago(a.createdAt)}</div></div></div>`;
    }).join('');
    fixAvatars(el);
    el.querySelectorAll('.item[data-id]').forEach((it) => it.onclick = () => select(Number(it.dataset.id)));
  }

  function hl(text) {
    const t = esc(text), q = filter.q.trim();
    if (!q) return t;
    const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return t.replace(re, (m) => `<mark>${m}</mark>`);
  }
  const linkify = (html) => html.replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

  function decideBar(a) {
    if (!['pending', 'under_review'].includes(a.status)) return '';
    if (!DB.remote?.token) return '';
    const btns = `
      <button class="btn ok" data-act="accept">✅ Accept</button>
      <button class="btn no" data-act="deny">❌ Deny</button>
      ${a.status === 'pending' ? '<button class="btn rev" data-act="review">👀 Under review</button>' : ''}`;
    return `<div class="decide"><span class="lbl">Decision</span>${discord ? btns : '<button class="btn discord" data-act="signin">🔐 Sign in to decide</button>'}
      <span class="hint">${discord ? 'Same as the buttons in the Discord log: the applicant gets a DM and the log message is updated.' : 'Sign in once with a code the bot sends you on Discord: it checks you are allowed to review this role.'}</span></div>`;
  }

  function renderDetail() {
    const el = $('#detail');
    const a = DB.applications.find((x) => x.id === selected);
    if (!a) {
      el.innerHTML = `<div class="placeholder"><div><img src="logo.png" alt=""><div>Pick an application to see every answer</div></div></div>`;
      $('#main').classList.remove('showdetail');
      return;
    }
    $('#main').classList.add('showdetail');
    const r = role(a.roleKey);
    const g = DB.guild?.id;
    const msgLink = g && a.logChannelId && a.logMessageId ? `https://discord.com/channels/${g}/${a.logChannelId}/${a.logMessageId}` : null;
    const small = (t) => `<br><small style="color:var(--muted)">${t}</small>`;
    const cells = [
      ['User', esc(a.username)], ['Discord ID', `<span class="code">${esc(a.userId)}</span>`],
      ['Role', `${esc(r.emoji)} ${esc(r.label)}`], ['Language', a.language === 'it' ? '🇮🇹 Italian' : '🇬🇧 English'],
      ['Verification code', `<span class="code">${esc(a.code)}</span>`], ['Status', badge(a.status)],
      ['Submitted', fmt(a.createdAt) + small(ago(a.createdAt))],
      ['Time to complete', dur(a.durationSec)],
      ['Discord account created', a.accountCreatedAt ? fmt(a.accountCreatedAt, {dateStyle:'medium'}) + small(ago(a.accountCreatedAt)) : '—'],
      ['Joined the server', a.joinedAt ? fmt(a.joinedAt, {dateStyle:'medium'}) + small(ago(a.joinedAt)) : '—'],
      ['Reviewed by', a.reviewedBy ? esc(a.reviewedBy.tag) + (a.reviewedVia === 'dashboard' ? small('via dashboard') : '') : '—'],
      ['Reviewed', fmt(a.reviewedAt)],
    ];
    const others = DB.applications.filter((x) => x.userId === a.userId && x.id !== a.id);
    const answered = a.answers.filter((x) => x.answer).length;
    el.innerHTML = `
      <button class="btn back" id="back">← List</button>
      <div class="dhead">${avatar(a)}
        <div><h2>${esc(a.displayName || a.username)}</h2>
        <div class="sub">${esc(r.emoji)} ${esc(r.label)} application • #${a.id} • ${badge(a.status)}</div></div>
        <div class="actions">
          <a class="btn" href="https://discord.com/users/${esc(a.userId)}" target="_blank" rel="noopener">👤 Profile</a>
          ${msgLink ? `<a class="btn" href="${msgLink}" target="_blank" rel="noopener">💬 Log message</a>` : ''}
          <button class="btn" id="copylink">🔗 Copy link</button>
          <button class="btn" id="copyall">📋 Copy answers</button>
        </div></div>
      ${decideBar(a)}
      <div class="grid">${cells.map(([k, v]) => `<div class="cell"><b>${k}</b><span>${v}</span></div>`).join('')}</div>
      ${a.reviewNotes ? `<div class="note" style="border-color:var(--${a.status})"><b>Reason / Notes:</b> ${esc(a.reviewNotes)}</div>` : ''}
      <h3>Answers • ${answered}/${a.answers.length}</h3>
      ${a.answers.map((x, i) => `<div class="qa"><div class="q"><i>${i + 1}</i><span>${esc(qText(x))}</span></div>
        ${a.language === 'it' && x.question ? `<div class="orig">🇮🇹 ${esc(x.question)}</div>` : ''}
        <div class="a ${x.answer ? '' : 'emptyans'}">${x.answer ? linkify(hl(x.answer)) : 'No answer'}</div></div>`).join('')}
      <h3>Timeline</h3>
      <ul class="timeline">${(a.history || []).map((h) => `<li style="--dot:var(--${h.status})"><b>${stEmoji(h.status)} ${esc(stLabel(h.status))}</b> • ${fmt(h.at)}${h.by ? ` • by <b>${esc(h.by.tag)}</b>` : ''}${h.via === 'dashboard' ? ' • via dashboard' : ''}${h.note ? `<br><i>${esc(h.note)}</i>` : ''}</li>`).join('')}</ul>
      ${others.length ? `<h3>Other applications from this user</h3>${others.map((o) => `<div class="item" data-id="${o.id}" style="border:1px solid var(--border);border-radius:12px;margin-bottom:8px">
        <div class="meta"><div class="n">${esc(role(o.roleKey).emoji)} ${esc(role(o.roleKey).label)} • #${o.id}</div><div class="r">${fmt(o.createdAt)}</div></div>
        <div class="right">${badge(o.status)}</div></div>`).join('')}` : ''}
      ${a.migrated ? '<p style="color:var(--muted);font-size:12px;margin-top:24px">Imported from the old bot: some details (avatar, account dates) were not available.</p>' : ''}`;
    el.scrollTop = 0;
    fixAvatars(el);
    $('#back').onclick = () => { selected = null; history.replaceState(null, '', location.pathname); render(); };
    $('#copylink').onclick = () => copy(`${location.origin}${location.pathname}#app-${a.id}`, 'Link copied');
    $('#copyall').onclick = () => copy(
      `Application #${a.id} — ${r.label} — ${a.username} (${a.userId})\nStatus: ${stLabel(a.status)} • Code: ${a.code}\n\n` +
      a.answers.map((x, i) => `${i + 1}. ${qText(x)}\n${x.answer || '—'}`).join('\n\n'), 'Answers copied');
    el.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => b.dataset.act === 'signin' ? signIn() : openDecision(a, b.dataset.act));
    el.querySelectorAll('.item[data-id]').forEach((it) => it.onclick = () => select(Number(it.dataset.id)));
  }

  function select(id) {
    selected = id;
    history.replaceState(null, '', `#app-${id}`);
    render();
  }

  function render() {
    $('#gname').textContent = DB.guild?.name ? `${DB.guild.name} • Applications` : 'LightMC • Applications';
    $('#updated').textContent = `Updated ${ago(DB.generatedAt)} • ${fmt(DB.generatedAt)}`;
    renderAuth(); renderStats(); renderList(); renderDetail();
  }

  // ---------- decisions from the dashboard ----------
  const ACT = {
    accept: { title: 'Accept application', verb: 'accept', cls: 'ok', label: '✅ Accept' },
    deny: { title: 'Deny application', verb: 'deny', cls: 'no', label: '❌ Deny' },
    review: { title: 'Mark as under review', verb: 'mark as under review', cls: 'rev', label: '👀 Under review' },
  };
  function openDecision(a, act) {
    const d = ACT[act], dlg = $('#dlg'), okb = $('#dlgok');
    $('#dlgtitle').textContent = `${d.title} #${a.id}`;
    $('#dlgtext').innerHTML = `You're about to <b>${d.verb}</b> the ${esc(role(a.roleKey).label)} application from <b>${esc(a.displayName || a.username)}</b>. They will be notified by DM.`;
    $('#dlgreason').value = '';
    $('#dlgreason').classList.toggle('hidden', act !== 'deny');
    $('#dlgstatus').innerHTML = '';
    okb.className = `btn ${d.cls}`; okb.textContent = d.label; okb.disabled = false; $('#dlgcancel').disabled = false;
    okb.onclick = async (ev) => {
      ev.preventDefault();
      okb.disabled = true; $('#dlgcancel').disabled = true;
      try {
        const res = await sendAction(a, act, $('#dlgreason').value.trim(), (t) => $('#dlgstatus').innerHTML = `<span class="spin"></span>${esc(t)}`);
        if (res.ok) {
          if (res.app) { const i = DB.applications.findIndex((x) => x.id === res.app.id); if (i >= 0) DB.applications[i] = res.app; }
          dlg.close(); render(); toast(res.text || 'Done');
          setTimeout(() => refresh(true), 6000);
        } else {
          $('#dlgstatus').innerHTML = `<span style="color:var(--denied)">⚠️ ${esc(res.title)}: ${esc(res.text)}</span>`;
          if (res.signedOut) { kv.del(DC_KEY); discord = null; renderAuth(); }
          if (res.app) { const i = DB.applications.findIndex((x) => x.id === res.app.id); if (i >= 0) DB.applications[i] = res.app; render(); }
          $('#dlgcancel').disabled = false;
        }
      } catch (e) {
        $('#dlgstatus').innerHTML = `<span style="color:var(--denied)">⚠️ ${esc(e.message)}</span>`;
        okb.disabled = false; $('#dlgcancel').disabled = false;
      }
    };
    dlg.showModal();
  }

  function sendAction(a, action, reason, progress) {
    if (!discord) throw new Error('Sign in first.');
    return queue({ appId: a.id, action, reason, session: discord.session }, progress);
  }

  /** Sends an encrypted request to the bot through the repo and waits for its encrypted answer. */
  async function queue(payload, progress) {
    const r = DB.remote;
    const id = crypto.randomUUID();
    progress('Sending the request…');
    const env = await encrypt({ ...payload, id, at: Date.now() }, password);
    const body = JSON.stringify({ message: `action ${id}`, branch: r.queueBranch, content: btoa(JSON.stringify(env)) });
    for (let i = 0; ; i++) { // writes on the same branch can race with the bot: retry on conflict
      try { await gh(`contents/actions/${id}.json`, { method: 'PUT', body }); break; }
      catch (e) { if (i >= 3 || !/409|422/.test(e.message)) throw e; await sleep(500 * (i + 1)); }
    }
    const start = Date.now();
    let head = null;
    while (Date.now() - start < 90_000) {
      progress(`Waiting for the bot… ${Math.round((Date.now() - start) / 1000)}s`);
      await sleep(1200);
      // Watch the branch head; read the result at that exact commit (never a stale copy).
      const ref = await gh(`git/ref/heads/${r.queueBranch}`).catch(() => null);
      if (!ref || ref.object.sha === head) continue;
      head = ref.object.sha;
      const f = await gh(`contents/results/${id}.json?ref=${head}`, { allow404: true }).catch(() => null);
      if (!f) continue;
      const res = await decrypt(JSON.parse(atob(f.content.replace(/\n/g, ''))), password);
      gh(`contents/results/${id}.json`, { method: 'DELETE', body: JSON.stringify({ message: `ack ${id}`, sha: f.sha, branch: r.queueBranch }) }).catch(() => {});
      return res;
    }
    throw new Error('The bot did not answer within 90s. Is it online? The request will still be processed when it comes back.');
  }

  // ---------- toolbar ----------
  let qt;
  $('#q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { filter.q = e.target.value; renderList(); renderDetail(); }, 150); });
  $('#frole').onchange = (e) => { filter.role = e.target.value; renderList(); };
  $('#flang').onchange = (e) => { filter.lang = e.target.value; renderList(); };
  $('#fsort').onchange = (e) => { filter.sort = e.target.value; renderList(); };
  addEventListener('hashchange', () => { const m = /^#app-(\d+)$/.exec(location.hash); if (DB && m) { selected = Number(m[1]); render(); } });

  $('#export').onclick = () => {
    const list = filtered();
    const qs = [...new Set(list.flatMap((a) => a.answers.map(qText)))];
    const head = ['ID', 'Code', 'User', 'Discord ID', 'Role', 'Status', 'Language', 'Submitted', 'Reviewed by', 'Notes', ...qs];
    const rows = list.map((a) => [a.id, a.code, a.username, a.userId, role(a.roleKey).label, stLabel(a.status), a.language, fmt(a.createdAt),
      a.reviewedBy?.tag || '', a.reviewNotes || '', ...qs.map((q) => a.answers.find((x) => qText(x) === q)?.answer || '')]);
    const csv = [head, ...rows].map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    Object.assign(document.createElement('a'), { href: url, download: `applications-${new Date().toISOString().slice(0, 10)}.csv` }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  function copy(text, msg) { navigator.clipboard?.writeText(text).then(() => toast(msg), () => toast("Couldn't copy")); }
  let tt, pendingToast = null;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
  function toastLater(msg) { pendingToast = msg; }

  // ---------- boot ----------
  const saved = kv.get(PW_KEY);
  if (saved) {
    $('#pw').value = saved;
    load(saved).then((d) => { DB = d; password = saved; openApp(); if (pendingToast) toast(pendingToast); })
      .catch((e) => { if (e.badpw) kv.del(PW_KEY); $('#pw').value = ''; $('#lockerr').textContent = e.badpw ? '' : e.message; });
  } else if (pendingToast) $('#lockerr').textContent = pendingToast;
})();
</script>
</body>
</html>
